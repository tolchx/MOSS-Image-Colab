[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosskit"
version = "0.1.0"
description = "Local ComfyUI toolkit for MOSS-Image: layout JSON compiler, masked inpaint compositing, sampling profiles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["mosskit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
